function classifyPost(p){

  const raw=[p.title,p.summary,p.listing_no].filter(Boolean).join(" ")+" "+String(p.content_html||"").replace(/<[^>]*>/g," ").replace(/&nbsp;|&#160;/g," ");

  const t=raw.replace(/\s+/g," ");

  let kind="";

  const kinds=[[/공장|창고/,"공장·창고"],[/오피스텔/,"오피스텔"],[/아파트/,"아파트"],[/빌라|다세대|연립/,"빌라"],[/상가|점포/,"상가"],[/토지|대지|임야|전답/,"토지"],[/단독주택|전원주택|다가구/,"주택"],[/건물|빌딩/,"건물"]];

  for(const [re,label] of kinds){if(re.test(t)){kind=label;break;}}

  let deal="";

  const deals=[[/전세/,"전세"],[/월세|월 임대료/,"월세"],[/매매|매도/,"매매"],[/임대차|임대\s/,"임대"]];

  for(const [re,label] of deals){if(re.test(t)){deal=label;break;}}

  let price="";

  // 먼저 본문 매물정보 표의 가격 항목을 확인합니다. AI가 작성한 제목·요약보다

  try {

    const template=document.createElement("template");

    template.innerHTML=String(p.content_html||"");

    const rows=[...template.content.querySelectorAll("tr")];

    for(const row of rows){

      const cells=[...row.querySelectorAll("th,td")].map(el=>(el.textContent||"").replace(/\s+/g," ").trim());

      if(cells.length<2)continue;

      const label=cells[0].replace(/[\s:*：]/g,"");

      if(/^(희망)?(매매가|전세가|보증금|월세|가격|거래금액|매매가격|임대료)$/.test(label)){

        const value=cells.slice(1).join(" / ").trim();

        if(value && !/미정|문의|협의|별도문의/.test(value)){price=value;break;}

      }

    }

  } catch(e) {}

  // 표에 가격 항목이 없을 때만 제목·요약에서 보조 추출합니다.

  if(!price){

    if(priceMatch)price=priceMatch[1].replace(/\s+/g," ").trim();

  }

  return {kind,deal,price};

}

const BLOG_DEAL_COLORS={"매매":"#2E4A7A","전세":"#16804A","월세":"#B66A16","임대":"#7652A3"};

function cardHtml(p){const target=encodeURIComponent(p.slug||p.id),c=classifyPost(p);const kindColor=BLOG_KIND_COLORS[c.kind]||"#5A6478",dealColor=BLOG_DEAL_COLORS[c.deal]||"#5A6478";const labels=(c.kind?`<span class="post-tag kind-tag" style="background:${kindColor}">${esc(c.kind)}</span>`:"")+(c.deal?`<span class="post-tag deal-tag" style="background:${dealColor}">${esc(c.deal)}</span>`:"");return `<a class="card" href="/blog.html?slug=${target}"><div class="cover">${coverHtml(p)}</div><div class="card-body"><div class="post-tags">${labels}</div><div class="date">${esc(fmtDate(p.published_at||p.created_at))}</div><h2>${esc(p.title||"제목 없는 글")}</h2>${c.price?`<div class="post-price"><span class="post-price-label">매물 가격</span><span class="post-price-value">${esc(c.price)}</span></div>`:""}<p class="summary">${esc(p.summary||"리얼워커스 부동산블로그")}</p></div></a>`;}

function featuredCardHtml(p){const target=encodeURIComponent(p.slug||p.id),c=classifyPost(p);const img=String(p.cover_image_url||"").trim();const labels=(c.kind?`<span class="post-tag">${esc(c.kind)}</span>`:"")+(c.deal?`<span class="post-tag">${esc(c.deal)}</span>`:"");return `<a class="featured-card" href="/blog.html?slug=${target}" aria-label="오늘의 추천 매물: ${esc(p.title||"제목 없는 글")}">${img?`<img class="featured-photo" src="${esc(img)}" alt="" loading="lazy" onerror="this.style.display='none'"><span class="featured-watermark" aria-hidden="true">REAL WALKERS</span>`:'<span class="featured-fallback"></span>'}<div class="featured-topline"><span class="featured-kicker">TODAY'S PICK</span><span class="featured-number">FEATURED PROPERTY</span></div><div class="featured-info"><div class="featured-tags">${labels}</div><h3 class="featured-title">${esc(p.title||"제목 없는 글")}</h3><div class="featured-price-row"><div>${c.price?`<div class="featured-price-label">LISTING PRICE</div><div class="featured-price">${esc(c.price)}</div>`:`<div class="featured-price-label">REAL WALKERS</div><div class="featured-price">매물 자세히 보기</div>`}</div><span class="featured-arrow" aria-hidden="true">↗</span></div></div></a>`;}

function getFeaturedDetails(p){const c=classifyPost(p),fields=[];try{const template=document.createElement("template");template.innerHTML=String(p.content_html||"");for(const row of template.content.querySelectorAll("tr")){const cells=[...row.querySelectorAll("th,td")].map(el=>(el.textContent||"").replace(/\s+/g," ").trim());if(cells.length<2)continue;const label=cells[0].replace(/[\s:*：]/g,"");const value=cells.slice(1).join(" / ").trim();if(!value||/미정|문의|협의|별도문의/.test(value))continue;const normalized=({소재지:"위치",주소:"위치",위치:"위치",면적:"면적",대지면적:"면적",연면적:"연면적",건축면적:"건축면적",용도지역:"용도지역",매물번호:"매물번호",매물유형:"유형",건물용도:"유형",사용승인:"사용승인"})[label];if(normalized&&!fields.some(x=>x.label===normalized))fields.push({label:normalized,value});}}catch(e){}const preferred=["위치","면적","연면적","용도지역","유형","매물번호","사용승인","건축면적"];fields.sort((a,b)=>preferred.indexOf(a.label)-preferred.indexOf(b.label));const rows=[];if(c.kind)rows.push({label:"매물 유형",value:c.kind});if(c.deal)rows.push({label:"거래 방식",value:c.deal});if(c.price)rows.push({label:"가격",value:c.price});for(const f of fields){if(!rows.some(x=>x.label===f.label)&&rows.length<6)rows.push(f);}if(p.listing_no&&!rows.some(x=>x.label==="매물번호")&&rows.length<6)rows.push({label:"매물번호",value:p.listing_no});return rows.slice(0,6);}

function featuredDetailsHtml(p){const target=encodeURIComponent(p.slug||p.id),details=getFeaturedDetails(p),summary=String(p.summary||"").trim();return `<aside class="featured-detail-panel"><div class="featured-detail-kicker">PROPERTY BRIEF / RW</div><h3 class="featured-detail-title">한눈에 보는 매물 정보</h3><p class="featured-detail-summary">${esc(summary||"사진과 주요 조건을 확인하고 상세 페이지에서 매물 정보를 살펴보세요.")}</p><div class="featured-detail-rule"></div><div class="featured-detail-list">${details.map(d=>`<div class="featured-detail-row"><span class="featured-detail-label">${esc(d.label)}</span><span class="featured-detail-value">${esc(d.value)}</span></div>`).join("")||`<div class="featured-detail-row"><span class="featured-detail-label">상세 정보</span><span class="featured-detail-value">본문에서 확인해 주세요.</span></div>`}</div><div class="featured-detail-bottom"><a class="featured-detail-cta" href="/blog.html?slug=${target}"><span>추천 매물 자세히 보기</span><span aria-hidden="true">↗</span></a><p class="featured-detail-note">실제 게시글에 등록된 정보를 기준으로 표시합니다.</p></div></aside>`;}

async function getPosts(){const u=SUPABASE_URL+"/rest/v1/blog_posts?select=id,title,slug,summary,content_html,cover_image_url,listing_no,status,created_at,published_at&status=eq.published&order=published_at.desc.nullslast,created_at.desc&limit=100";const r=await fetch(u,{headers});const body=await r.text();if(!r.ok)throw new Error("HTTP "+r.status+": "+body);return JSON.parse(body);}

function safeArticleHtml(html){const template=document.createElement("template");template.innerHTML=String(html||"");template.content.querySelectorAll("script,style,iframe,object,embed,form").forEach(n=>n.remove());template.content.querySelectorAll("*").forEach(el=>{[...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(n.startsWith("on")||n==="srcdoc"||((n==="href"||n==="src")&&(v.startsWith("javascript:")||v.startsWith("data:"))))el.removeAttribute(a.name);});});return template.innerHTML;}

function routeInquiryLinks(html,p,c){const template=document.createElement("template");template.innerHTML=String(html||"");const url="/?ask=1&listing_no="+encodeURIComponent(p.listing_no||"")+"&title="+encodeURIComponent(p.title||"")+"&deal="+encodeURIComponent(c.deal||"")+"&price="+encodeURIComponent(c.price||"");template.content.querySelectorAll("a").forEach(a=>{if(/문의하기|매물 문의|문의\s*상담/.test((a.textContent||"").replace(/\s+/g," ").trim()))a.setAttribute("href",url);});return template.innerHTML;}

function watermarkArticlePhotos(root){
  if(!root) return;
  root.querySelectorAll(".article-content img").forEach(img=>{
    if(img.closest(".rw-location-map") || img.closest(".rw-watermark-frame")) return;
    const frame=document.createElement("span");
    frame.className="rw-watermark-frame";
    frame.style.cssText="position:relative;display:inline-block;max-width:100%;line-height:0;vertical-align:top;";
    img.parentNode.insertBefore(frame,img);
    frame.appendChild(img);
    const mark=document.createElement("span");
    mark.className="rw-watermark";
    mark.setAttribute("aria-hidden","true");
    mark.textContent="REAL WALKERS";
    frame.appendChild(mark);
  });
}

async function init(){const params=new URLSearchParams(location.search),slug=params.get("slug");const listing=document.getElementById("listingView"),article=document.getElementById("articleView");try{if(slug){const isUuid=/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(slug);const field=isUuid?"id":"slug";const url=SUPABASE_URL+"/rest/v1/blog_posts?select=id,title,slug,summary,content_html,cover_image_url,listing_no,status,created_at,published_at&status=eq.published&"+field+"=eq."+encodeURIComponent(slug)+"&limit=1";const r=await fetch(url,{headers});const body=await r.text();if(!r.ok)throw new Error("HTTP "+r.status+": "+body);const rows=JSON.parse(body),p=rows[0];if(!p){listing.hidden=false;document.getElementById("posts").innerHTML='<div class="empty">글을 찾을 수 없거나 아직 공개되지 않았습니다.</div>';return;}listing.hidden=true;article.hidden=false;document.title=(p.title||"리얼워커스 블로그")+" | 리얼워커스";document.querySelector('meta[name="description"]').content=p.summary||"리얼워커스 부동산블로그";const c=classifyPost(p);const inquiryUrl="/?ask=1&listing_no="+encodeURIComponent(p.listing_no||"") + "&title="+encodeURIComponent(p.title||"") + "&deal="+encodeURIComponent(c.deal||"") + "&price="+encodeURIComponent(c.price||"");article.innerHTML=`<div class="article-head"><div class="eyebrow">REAL WALKERS JOURNAL</div><h1>${esc(p.title||"제목 없는 글")}</h1><div class="date">${esc(fmtDate(p.published_at||p.created_at))}</div>${p.summary?`<p class="article-summary">${esc(p.summary)}</p>`:""}</div>${p.cover_image_url?`<div class="article-cover-frame"><img class="article-cover" src="${esc(p.cover_image_url)}" alt="대표 사진" onerror="this.style.display='none'"><span class="rw-watermark" aria-hidden="true">REAL WALKERS</span></div>`:""}<div class="article-content">${routeInquiryLinks(safeArticleHtml(p.content_html||"<p>본문이 없습니다.</p>"),p,c)}</div><div class="article-footer"><a class="back" href="/blog.html">← 글 목록</a><a class="primary" href="${inquiryUrl}">매물 문의하기</a></div>`;watermarkArticlePhotos(article);}else{const posts=await getPosts(),grid=document.getElementById("posts"),featuredSection=document.getElementById("featuredSection"),featuredGrid=document.getElementById("featuredPosts");if(posts.length){const shuffled=posts.slice();for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}const featured=shuffled.slice(0,1);const featuredIds=new Set(featured.map(p=>String(p.id)));const remaining=posts.filter(p=>!featuredIds.has(String(p.id)));featuredGrid.innerHTML=featured.map(p=>featuredCardHtml(p)).join("")+featured.map(p=>featuredDetailsHtml(p)).join("");featuredSection.hidden=false;grid.innerHTML=remaining.length?remaining.map(cardHtml).join(""):'<div class="empty">추천 매물 외 다른 게시글이 없습니다.</div>';}else{featuredSection.hidden=true;grid.innerHTML='<div class="empty">아직 공개된 부동산블로그 글이 없습니다.</div>';}}}catch(e){console.error("블로그 불러오기 오류",e);if(slug){listing.hidden=true;article.hidden=false;article.innerHTML='<div class="status">글을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div><a class="back" href="/blog.html">글 목록으로</a>';}else{document.getElementById("featuredSection").hidden=true;document.getElementById("posts").innerHTML='<div class="empty">글을 불러오지 못했습니다. Supabase 권한과 연결 상태를 확인해 주세요.</div>';}}}

init();

</script></body></html>
