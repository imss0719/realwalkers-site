<main class="wrap"><div id="listingView"><div class="eyebrow">REAL WALKERS JOURNAL</div><h1 class="page-title">리얼워커스 블로그</h1><p class="lead">부동산 시장과 매물 검토에 도움이 되는 정보를 전합니다.</p><div id="posts" class="grid"><div class="empty">공개된 글을 불러오는 중입니다…</div></div></div><article id="articleView" class="article" hidden></article></main>

<script>
const SUPABASE_URL="https://ggnpjqqjwkxptbvkvgpc.supabase.co";
const SUPABASE_KEY="sb_publishable_IfevSekhTOzwlFBzRvd0gw_VHq2A9LO";
const headers={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtDate(v){if(!v)return "";const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"});}
function coverHtml(p){const u=String(p.cover_image_url||"").trim();return u?`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.style.display='none'">`:'<span>REAL WALKERS</span>';}
function cardHtml(p){const target=encodeURIComponent(p.slug||p.id);return `<a class="card" href="/blog.html?slug=${target}"><div class="cover">${coverHtml(p)}</div><div class="card-body"><div class="date">${esc(fmtDate(p.published_at||p.created_at))}</div><h2>${esc(p.title||"제목 없는 글")}</h2><p class="summary">${esc(p.summary||"리얼워커스 부동산블로그")}</p></div></a>`;}
async function getPosts(){const u=SUPABASE_URL+"/rest/v1/blog_posts?select=id,title,slug,summary,content_html,cover_image_url,listing_no,status,created_at,published_at&status=eq.published&order=published_at.desc.nullslast,created_at.desc&limit=100";const r=await fetch(u,{headers});const body=await r.text();if(!r.ok)throw new Error("HTTP "+r.status+": "+body);return JSON.parse(body);}
function safeArticleHtml(html){const template=document.createElement("template");template.innerHTML=String(html||"");template.content.querySelectorAll("script,style,iframe,object,embed,form").forEach(n=>n.remove());template.content.querySelectorAll("*").forEach(el=>{[...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(n.startsWith("on")||n==="srcdoc"||((n==="href"||n==="src")&&(v.startsWith("javascript:")||v.startsWith("data:"))))el.removeAttribute(a.name);});});return template.innerHTML;}
async function init(){const params=new URLSearchParams(location.search),slug=params.get("slug");const listing=document.getElementById("listingView"),article=document.getElementById("articleView");try{if(slug){const isUuid=/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(slug);const field=isUuid?"id":"slug";const url=SUPABASE_URL+"/rest/v1/blog_posts?select=id,title,slug,summary,content_html,cover_image_url,listing_no,status,created_at,published_at&status=eq.published&"+field+"=eq."+encodeURIComponent(slug)+"&limit=1";const r=await fetch(url,{headers});const body=await r.text();if(!r.ok)throw new Error("HTTP "+r.status+": "+body);const rows=JSON.parse(body),p=rows[0];if(!p){listing.hidden=false;document.getElementById("posts").innerHTML='<div class="empty">글을 찾을 수 없거나 아직 공개되지 않았습니다.</div>';return;}listing.hidden=true;article.hidden=false;document.title=(p.title||"리얼워커스 블로그")+" | 리얼워커스";document.querySelector('meta[name="description"]').content=p.summary||"리얼워커스 부동산블로그";article.innerHTML=`<div class="article-head"><div class="eyebrow">REAL WALKERS JOURNAL</div><h1>${esc(p.title||"제목 없는 글")}</h1><div class="date">${esc(fmtDate(p.published_at||p.created_at))}</div>${p.summary?`<p class="article-summary">${esc(p.summary)}</p>`:""}</div>${p.cover_image_url?`<img class="article-cover" src="${esc(p.cover_image_url)}" alt="대표 사진" onerror="this.style.display='none'">`:""}<div class="article-content">${safeArticleHtml(p.content_html||"<p>본문이 없습니다.</p>")}</div><div class="article-footer"><a class="back" href="/blog.html">← 글 목록</a><a class="primary" href="/">매물 둘러보기</a></div>`;}else{const posts=await getPosts(),grid=document.getElementById("posts");grid.innerHTML=posts.length?posts.map(cardHtml).join(""):'<div class="empty">아직 공개된 부동산블로그 글이 없습니다.</div>';}}catch(e){console.error("블로그 불러오기 오류",e);if(slug){listing.hidden=true;article.hidden=false;article.innerHTML='<div class="status">글을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div><a class="back" href="/blog.html">글 목록으로</a>';}else document.getElementById("posts").innerHTML='<div class="empty">글을 불러오지 못했습니다. Supabase 권한과 연결 상태를 확인해 주세요.</div>';}}
init();
</script></body></html>
