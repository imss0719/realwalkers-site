<script>
const SUPABASE_URL="https://ggnpjqqjwkxptbvkvgpc.supabase.co";
const SUPABASE_KEY="sb_publishable_IfevSekhTOzwlFBzRvd0gw_VHq2A9LO";
const headers={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtDate(v){if(!v)return "";const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"});}
function coverHtml(p){const u=String(p.cover_image_url||"").trim();return u?`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.style.display='none'">`:'<span>REAL WALKERS</span>';}
function classifyPost(p){
  const raw=[p.title,p.summary,p.listing_no].filter(Boolean).join(" ")+" "+String(p.content_html||"").replace(/<[^>]*>/g," ").replace(/&nbsp;|&#160;/g," ");
  const t=raw.replace(/\s+/g," ");
  let kind="";
  const kinds=[[/공장|창고/,"공장·창고"],[/오피스텔/,"오피스텔"],[/아파트/,"아파트"],[/빌라|다세대|연립/,"빌라"],[/상가|점포/,"상가"],[/토지|대지|임야|전답/,"토지"],[/단독주택|전원주택|다가구/,"주택"],[/건물|빌딩/,"건물"]];
  for(const [re,label] of kinds){if(re.test(t)){kind=label;break;}}
  let deal="";
  const deals=[[/전세/,"전세"],[/월세|월 임대료/,"월세"],[/매매|매도/,"매매"],[/임대차|임대\s/,"임대"]];
  for(const [re,label] of deals){if(re.test(t)){deal=label;break;}}
  let price="";
  // 먼저 본문 매물정보 표의 가격 항목을 확인합니다. AI가 작성한 제목·요약보다
  // 본문에 구조화되어 들어간 매물정보를 우선 사용합니다.
  try {
    const template=document.createElement("template");
    template.innerHTML=String(p.content_html||"");
    const rows=[...template.content.querySelectorAll("tr")];
    for(const row of rows){
      const cells=[...row.querySelectorAll("th,td")].map(el=>(el.textContent||"").replace(/\s+/g," ").trim());
      if(cells.length<2)continue;
      const label=cells[0].replace(/[\s:*：]/g,"");
      if(/^(희망)?(매매가|전세가|보증금|월세|가격|거래금액|매매가격|임대료)$/.test(label)){
        const value=cells.slice(1).join(" / ").trim();
        if(value && !/미정|문의|협의|별도문의/.test(value)){price=value;break;}
      }
    }
  } catch(e) {}
  // 표에 가격 항목이 없을 때만 제목·요약에서 보조 추출합니다.
  if(!price){
    const titleSummary=[p.title,p.summary].filter(Boolean).join(" ");
    const priceMatch=titleSummary.match(/(?:희망\s*)?(?:매매가|전세가|보증금|가격|매매|전세|월세)?\s*([0-9][0-9,]*(?:\.[0-9]+)?\s*(?:억(?:\s*[0-9,]+\s*만(?:원)?)?|만\s*원|원)(?:\s*\/\s*(?:월\s*)?[0-9][0-9,]*\s*만?\s*원?)?)/);
    if(priceMatch)price=priceMatch[1].replace(/\s+/g," ").trim();
  }
  return {kind,deal,price};
}
const BLOG_KIND_COLORS={"아파트":"#2E4A7A","건물":"#8A6D1F","빌딩":"#8A6D1F","상가":"#5C7A4A","토지":"#7A4A4A","공장·창고":"#4A6E7A","공장":"#4A6E7A","창고":"#3F6060","주택":"#6E4A7A","빌라":"#8A5A7A","오피스텔":"#5A6478"};
const BLOG_DEAL_COLORS={"매매":"#2E4A7A","전세":"#16804A","월세":"#B66A16","임대":"#7652A3"};
function cardHtml(p){const target=encodeURIComponent(p.slug||p.id),c=classifyPost(p);const kindColor=BLOG_KIND_COLORS[c.kind]||"#5A6478",dealColor=BLOG_DEAL_COLORS[c.deal]||"#5A6478";const labels=(c.kind?`<span class="post-tag kind-tag" style="background:${kindColor}">${esc(c.kind)}</span>`:"")+(c.deal?`<span class="post-tag deal-tag" style="background:${dealColor}">${esc(c.deal)}</span>`:"");return `<a class="card" href="/blog.html?slug=${target}"><div class="cover">${coverHtml(p)}</div><div class="card-body"><div class="post-tags">${labels}</div><div class="date">${esc(fmtDate(p.published_at||p.created_at))}</div><h2>${esc(p.title||"제목 없는 글")}</h2>${c.price?`<div class="post-price"><span class="post-price-label">매물 가격</span><span class="post-price-value">${esc(c.price)}</span></div>`:""}<p class="summary">${esc(p.summary||"리얼워커스 부동산블로그")}</p></div></a>`;}
async function getPosts(){const u=SUPABASE_URL+"/rest/v1/blog_posts?select=id,title,slug,summary,content_html,cover_image_url,listing_no,status,created_at,published_at&status=eq.published&order=published_at.desc.nullslast,created_at.desc&limit=100";const r=await fetch(u,{headers});const body=await r.text();if(!r.ok)throw new Error("HTTP "+r.status+": "+body);return JSON.parse(body);}
function safeArticleHtml(html){const template=document.createElement("template");template.innerHTML=String(html||"");template.content.querySelectorAll("script,style,iframe,object,embed,form").forEach(n=>n.remove());template.content.querySelectorAll("*").forEach(el=>{[...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(n.startsWith("on")||n==="srcdoc"||((n==="href"||n==="src")&&(v.startsWith("javascript:")||v.startsWith("data:"))))el.removeAttribute(a.name);});});return template.innerHTML;}
function routeInquiryLinks(html,p,c){const template=document.createElement("template");template.innerHTML=String(html||"");const url="/?ask=1&listing_no="+encodeURIComponent(p.listing_no||"")+"&title="+encodeURIComponent(p.title||"")+"&deal="+encodeURIComponent(c.deal||"")+"&price="+encodeURIComponent(c.price||"");template.content.querySelectorAll("a").forEach(a=>{if(/문의하기|매물 문의|문의\s*상담/.test((a.textContent||"").replace(/\s+/g," ").trim()))a.setAttribute("href",url);});return template.innerHTML;}
async function init(){const params=new URLSearchParams(location.search),slug=params.get("slug");const listing=document.getElementById("listingView"),article=document.getElementById("articleView");try{if(slug){const isUuid=/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(slug);const field=isUuid?"id":"slug";const url=SUPABASE_URL+"/rest/v1/blog_posts?select=id,title,slug,summary,content_html,cover_image_url,listing_no,status,created_at,published_at&status=eq.published&"+field+"=eq."+encodeURIComponent(slug)+"&limit=1";const r=await fetch(url,{headers});const body=await r.text();if(!r.ok)throw new Error("HTTP "+r.status+": "+body);const rows=JSON.parse(body),p=rows[0];if(!p){listing.hidden=false;document.getElementById("posts").innerHTML='<div class="empty">글을 찾을 수 없거나 아직 공개되지 않았습니다.</div>';return;}listing.hidden=true;article.hidden=false;document.title=(p.title||"리얼워커스 블로그")+" | 리얼워커스";document.querySelector('meta[name="description"]').content=p.summary||"리얼워커스 부동산블로그";const c=classifyPost(p);const inquiryUrl="/?ask=1&listing_no="+encodeURIComponent(p.listing_no||"") + "&title="+encodeURIComponent(p.title||"") + "&deal="+encodeURIComponent(c.deal||"") + "&price="+encodeURIComponent(c.price||"");article.innerHTML=`<div class="article-head"><div class="eyebrow">REAL WALKERS JOURNAL</div><h1>${esc(p.title||"제목 없는 글")}</h1><div class="date">${esc(fmtDate(p.published_at||p.created_at))}</div>${p.summary?`<p class="article-summary">${esc(p.summary)}</p>`:""}</div>${p.cover_image_url?`<img class="article-cover" src="${esc(p.cover_image_url)}" alt="대표 사진" onerror="this.style.display='none'">`:""}<div class="article-content">${routeInquiryLinks(safeArticleHtml(p.content_html||"<p>본문이 없습니다.</p>"),p,c)}</div><div class="article-footer"><a class="back" href="/blog.html">← 글 목록</a><a class="primary" href="${inquiryUrl}">매물 문의하기</a></div>`;}else{const posts=await getPosts(),grid=document.getElementById("posts"),featuredSection=document.getElementById("featuredSection"),featuredGrid=document.getElementById("featuredPosts");if(posts.length){const shuffled=posts.slice();for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}const featured=shuffled.slice(0,Math.min(3,shuffled.length));const featuredIds=new Set(featured.map(p=>String(p.id)));const remaining=posts.filter(p=>!featuredIds.has(String(p.id)));featuredGrid.innerHTML=featured.map(cardHtml).join("");featuredSection.hidden=false;grid.innerHTML=remaining.length?remaining.map(cardHtml).join(""):'<div class="empty">추천 매물 외 다른 게시글이 없습니다.</div>';}else{featuredSection.hidden=true;grid.innerHTML='<div class="empty">아직 공개된 부동산블로그 글이 없습니다.</div>';}}}catch(e){console.error("블로그 불러오기 오류",e);if(slug){listing.hidden=true;article.hidden=false;article.innerHTML='<div class="status">글을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div><a class="back" href="/blog.html">글 목록으로</a>';}else{document.getElementById("featuredSection").hidden=true;document.getElementById("posts").innerHTML='<div class="empty">글을 불러오지 못했습니다. Supabase 권한과 연결 상태를 확인해 주세요.</div>';}}}
init();
