name: Sync Google Sheets to JSON

on:
  schedule:
    # 매시간 0분에 실행 (UTC 기준)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Download and convert Google Sheets CSV to JSON
        run: |
          node - << 'SCRIPT'
          const https = require('https');
          const fs = require('fs');
          const path = require('path');

          const CSV_URL = 'https://docs.google.com/spreadsheets/d/1jLASt0G1R4qZqsqvOMseZYA9GgLXiw_bzlexkcaQlv8/export?format=csv';

          function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            if (lines.length === 0) return [];

            // CSV 헤더 파싱
            const headers = [];
            let currentHeader = '';
            let inQuotes = false;

            for (let i = 0; i < lines[0].length; i++) {
              const char = lines[0][i];
              if (char === '"') {
                inQuotes = !inQuotes;
              } else if (char === ',' && !inQuotes) {
                headers.push(currentHeader.replace(/^"|"$/g, '').trim());
                currentHeader = '';
              } else {
                currentHeader += char;
              }
            }
            headers.push(currentHeader.replace(/^"|"$/g, '').trim());

            const data = [];

            for (let i = 1; i < lines.length; i++) {
              const values = [];
              let currentValue = '';
              let inQuotes = false;

              for (let j = 0; j < lines[i].length; j++) {
                const char = lines[i][j];
                if (char === '"') {
                  inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                  values.push(currentValue.replace(/^"|"$/g, '').trim());
                  currentValue = '';
                } else {
                  currentValue += char;
                }
              }
              values.push(currentValue.replace(/^"|"$/g, '').trim());

              const obj = {};
              headers.forEach((header, index) => {
                obj[header] = values[index] || '';
              });
              data.push(obj);
            }

            return data;
          }

          https.get(CSV_URL, (res) => {
            let csvData = '';

            res.on('data', (chunk) => {
              csvData += chunk;
            });

            res.on('end', () => {
              try {
                const jsonData = parseCSV(csvData);
                const timestamp = new Date().toISOString();
                const output = {
                  lastUpdated: timestamp,
                  count: jsonData.length,
                  data: jsonData
                };

                // data 폴더 생성
                const dataDir = 'data';
                if (!fs.existsSync(dataDir)) {
                  fs.mkdirSync(dataDir, { recursive: true });
                }

                // JSON 파일 저장
                fs.writeFileSync(
                  path.join(dataDir, 'listings.json'),
                  JSON.stringify(output, null, 2)
                );

                console.log(`✓ 데이터 동기화 완료: ${jsonData.length}개 매물`);
              } catch (error) {
                console.error('Error:', error);
                process.exit(1);
              }
            });
          }).on('error', (error) => {
            console.error('Error downloading CSV:', error);
            process.exit(1);
          });
          SCRIPT

      - name: Configure git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Commit and push changes
        run: |
          if git diff --quiet data/listings.json; then
            echo "No changes to commit"
          else
            git add data/listings.json
            git commit -m "chore: sync listings data from Google Sheets [skip ci]"
            git push
          fi
